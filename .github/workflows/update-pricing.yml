name: Update Model Pricing

on:
  schedule:
    - cron: '0 2 * * 1' # 每周一 02:00 UTC
  workflow_dispatch:

jobs:
  update-pricing:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update model pricing
        run: npm run pricing:update

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/modelPricing.generated.ts; then
            echo "No pricing changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/modelPricing.generated.ts
          git commit -m "chore(pricing): refresh model pricing snapshot"
          git push
